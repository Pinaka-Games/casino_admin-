name: Wulf Admin Production Image

on:
  push:
    branches:
      - production

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Admin Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA::8}"
          IMAGE="${{ secrets.ECR_REPOSITORY }}:${IMAGE_TAG}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "Branch : production"
          echo "Commit : ${GITHUB_SHA}"
          echo "Tag    : ${IMAGE_TAG}"
          echo "Image  : ${IMAGE}"
          echo "=============================================="

      - name: Build admin Docker image
        run: |
          echo "Building admin Docker image..."

          docker build \
            --no-cache \
            --build-arg "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" \
            --build-arg "NEXT_PUBLIC_USER_FRONTEND_URL=${{ secrets.NEXT_PUBLIC_USER_FRONTEND_URL }}" \
            --build-arg "NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }}" \
            -t "${IMAGE}" \
            .

          echo "Admin Docker image built successfully."

      - name: Push image to ECR
        run: |
          echo "Pushing admin image to ECR..."

          docker push "${IMAGE}"

          echo "Admin image pushed successfully."

      - name: Deployment summary
        run: |
          echo "=============================================="
          echo "Admin image pushed successfully"
          echo "=============================================="
          echo "Commit : ${GITHUB_SHA}"
          echo "Tag    : ${IMAGE_TAG}"
          echo "Image  : ${IMAGE}"
          echo "=============================================="